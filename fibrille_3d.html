window.addEventListener('load', function(){
  if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined'){
    document.getElementById('errbox').style.display = 'flex';
    return;

  try { init(); } catch(e){
    document.getElementById('errbox').style.display = 'flex';
    document.getElementById('errbox').innerHTML = 'Errore nella scena 3D: ' + e.message;
    console.error(e);
  }
});

  function catmullRom2D(ctrl, nSamples){
    var pts = [ctrl[0]].concat(ctrl).concat([ctrl[ctrl.length-1]]);
    var result = [];
    for (var i=1;i<pts.length-2;i++){
      var p0=pts[i-1],p1=pts[i],p2=pts[i+1],p3=pts[i+2];
      var segN = Math.max(2, Math.floor(nSamples/(pts.length-3)));
      for (var s=0;s<segN;s++){
        var t = s/segN;
        var t2=t*t,t3=t2*t;
        var x = 0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
        var z = 0.5*((2*p1.z)+(-p0.z+p2.z)*t+(2*p0.z-5*p1.z+4*p2.z-p3.z)*t2+(-p0.z+3*p1.z-3*p2.z+p3.z)*t3);
        result.push({x:x,z:z});
      }
    }
    result.push(ctrl[ctrl.length-1]);
    return result;
  }

  var spineSamples = catmullRom2D(spineCtrl, 240);
  var cum = [0];
  for (var si=1;si<spineSamples.length;si++){
    var dxs=spineSamples[si].x-spineSamples[si-1].x, dzs=spineSamples[si].z-spineSamples[si-1].z;
    cum.push(cum[si-1]+Math.sqrt(dxs*dxs+dzs*dzs));
  }
  var totalLen = cum[cum.length-1];

  function spineAt(t){
    var target = t*totalLen;
    var idx = 0;
    for (var i=0;i<cum.length-1;i++){
      idx = i;
      if (cum[i]<=target && cum[i+1]>=target) break;
    }
    var segLen = cum[idx+1]-cum[idx] || 1e-6;
    var localT = (target-cum[idx])/segLen;
    var p0=spineSamples[idx], p1=spineSamples[Math.min(idx+1,spineSamples.length-1)];
    return { x: p0.x+(p1.x-p0.x)*localT, z: p0.z+(p1.z-p0.z)*localT };

    var len=Math.sqrt(dx*dx+dz*dz)||1e-6;
    return {x:dx/len, z:dz/len};
  }

    var tan = spineTangent(t);
    return { x: -tan.z, z: tan.x };

  function buildVariableTube(curve, tubularSegments, radialSegments, radiusFn){
    var frames = curve.computeFrenetFrames(tubularSegments, false);
    var positions = [];
    var normals = [];
    var indices = [];

    for (var i = 0; i <= tubularSegments; i++){
      var t = i / tubularSegments;
      var point = curve.getPointAt(t);
      var N_ = frames.normals[i];
      var B_ = frames.binormals[i];
      var radius = radiusFn(t);

      for (var j = 0; j <= radialSegments; j++){
        var theta = (j / radialSegments) * Math.PI * 2;
        var sin = Math.sin(theta), cos = -Math.cos(theta);
        var nx = cos*N_.x + sin*B_.x;
        var ny = cos*N_.y + sin*B_.y;
        var nz = cos*N_.z + sin*B_.z;
        positions.push(point.x + radius*nx, point.y + radius*ny, point.z + radius*nz);
        normals.push(nx, ny, nz);
      }
    }

    for (var i2 = 0; i2 < tubularSegments; i2++){
      for (var j2 = 0; j2 < radialSegments; j2++){
        var a = (radialSegments+1)*i2 + j2;
        var b = (radialSegments+1)*(i2+1) + j2;
        var c = (radialSegments+1)*(i2+1) + j2+1;
        var d = (radialSegments+1)*i2 + j2+1;
        indices.push(a,b,d, b,c,d);
      }
    }

    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geo.setIndex(indices);
    return geo;
  }

    if (t < thresh) return rMin;
    var u = (t-thresh)/(1-thresh);
    var smooth = u*u*u*(u*(u*6-15)+10); // smoothstep quintico: transizione molto graduale
    return rMin + (rMax-rMin) * smooth;
  }

  var particlesPerTube = 3;
  var flowParticles = [];
  for (var fc=0; fc<flowCurves.length; fc++){
    for (var pp=0; pp<particlesPerTube; pp++){
      var particle = new THREE.Mesh(arrowGeo, flowMat);
      particle.renderOrder = 999;
      particle.userData.curve = flowCurves[fc];
      particle.userData.phase = Math.random();
      particle.userData.speedMul = 0.8 + Math.random()*0.4;
      tubeGroup.add(particle);
      flowParticles.push(particle);
    }
  }

  // ===================================================================================
  // INVERSIONE DI COLORE DELLE FIBRILLE (da scura a chiara)
  // Di tanto in tanto una fibrilla inizialmente scura transisce gradualmente al colore
  // chiaro giallo-arancione, per rappresentare l'evoluzione dinamica del plasma prevista
  // dalla teoria rivista. L'inversione avviene in ENTRAMBI i sensi (scuro->chiaro e
  // chiaro->scuro), quindi il fenomeno si ripete indefinitamente senza che le fibrille
  // scure "spariscano" col tempo. I tre parametri seguenti regolano FREQUENZA e DURATA
  // dell'evento e sono pensati per essere modificati liberamente:
  var FLIP_CHECK_INTERVAL_MS = 1000; // ogni quanti millisecondi si valuta un nuovo possibile evento
  var FLIP_PROBABILITY       = 0.50; // probabilita' di innesco ad ogni controllo
  var FLIP_TRANSITION_MS     = 1200; // durata (ms) della dissolvenza fra i due colori
  // ===================================================================================
  var lastFlipCheckTime = performance.now();
  var flipColorDark  = new THREE.Color(tubeColorDark);
  var flipColorLight = new THREE.Color(tubeColorLight);

  function updateColorFlips(now){
    // 1) verifica periodica (ogni FLIP_CHECK_INTERVAL_MS) se innescare un nuovo evento
    if (now - lastFlipCheckTime >= FLIP_CHECK_INTERVAL_MS){
      lastFlipCheckTime = now;
      if (Math.random() < FLIP_PROBABILITY){
        // sceglie una fibrilla qualsiasi non gia' in transizione: puo' essere sia
        // scura (passera' a chiara) sia chiara (tornera' scura) - processo reversibile
        var candidates = tubeMeshesData.filter(function(td){ return !td.flipping; });
        if (candidates.length > 0){
          var chosen = candidates[Math.floor(Math.random()*candidates.length)];
          chosen.flipping = true;
          chosen.flipStart = now;
          chosen.flipFrom = chosen.isLight ? flipColorLight : flipColorDark;
          chosen.flipTo   = chosen.isLight ? flipColorDark  : flipColorLight;
        }
      }
    }
    // 2) avanza le transizioni di colore attualmente in corso
    for (var ti=0; ti<tubeMeshesData.length; ti++){
      var td = tubeMeshesData[ti];
      if (!td.flipping) continue;
      var progress = (now - td.flipStart) / FLIP_TRANSITION_MS;
      if (progress >= 1){
        progress = 1;
        td.flipping = false;
        td.isLight = !td.isLight; // stato finale invertito rispetto a prima della transizione
      }
      td.material.color.lerpColors(td.flipFrom, td.flipTo, progress);
    }
  }

  scene.add(tubeGroup);

  var views = {
    top:  { pos:[320, 850, -110],  target:[320,0,-110] },
    iso:  { pos:[720, 380, -640], target:[320,0,-120] },
    side: { pos:[1080, 150, -110], target:[320,50,-110] }
  };

  function setView(name){
    var v = views[name];
    camera.position.set(v.pos[0], v.pos[1], v.pos[2]);
    controls.target.set(v.target[0], v.target[1], v.target[2]);
    controls.update();
    var btns = document.querySelectorAll('.panel button');
    for (var k=0;k<btns.length;k++) btns[k].classList.remove('active');
    var b = document.getElementById('btn-'+name);
    if (b) b.classList.add('active');
  }
  setView('iso');

  document.getElementById('btn-top').addEventListener('click', function(){ setView('top'); });
  document.getElementById('btn-iso').addEventListener('click', function(){ setView('iso'); });
  document.getElementById('btn-side').addEventListener('click', function(){ setView('side'); });

  var autoSpin = false;
  var spinBtn = document.getElementById('btn-spin');
  spinBtn.addEventListener('click', function(){
    autoSpin = !autoSpin;
    spinBtn.textContent = 'Rotazione auto: ' + (autoSpin ? 'on' : 'off');
    spinBtn.classList.toggle('active', autoSpin);
  });

  function animate(){
    requestAnimationFrame(animate);
    try {
      if (autoSpin){
        var tt = performance.now()*0.0002;
        var radius = camera.position.distanceTo(controls.target);
        camera.position.x = controls.target.x + radius*Math.sin(tt);
        camera.position.z = controls.target.z + radius*Math.cos(tt);
      }
      var now = performance.now();
      updateColorFlips(now);
      for (var fp=0; fp<flowParticles.length; fp++){
        try {
          var part = flowParticles[fp];
          var t = (now*0.00016*part.userData.speedMul + part.userData.phase) % 1;
          var pos = part.userData.curve.getPointAt(t);
          if (pos && isFinite(pos.x) && isFinite(pos.y) && isFinite(pos.z)){
            part.position.set(pos.x, pos.y, pos.z);
            var tang = part.userData.curve.getTangentAt(Math.min(t, 0.999));
            if (tang && isFinite(tang.x) && isFinite(tang.y) && isFinite(tang.z)){
              part.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), tang);
            }
          }
        } catch(errParticle){ /* ignora la singola particella problematica */ }
      }
      controls.update();
      renderer.render(scene, camera);
    } catch(errFrame){ /* non bloccare mai il ciclo di animazione */ }
  }
  animate();

  window.addEventListener('resize', function(){
    width = mount.clientWidth;
    height = mount.clientHeight;
    camera.aspect = width/height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  });
}
</script>
</body>
</html>
