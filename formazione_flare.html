const t=document.createElement('canvas');t.width=t.height=1024;const x=t.getContext('2d');

const NP=151,X0=-6.5,X1=6.5,D=-2.4,TOP=5.2,HMAX=7.6,HV=2.9,NS=20;

// zs: −1 tubo dietro, +1 davanti; sx: lato di partenza in x; dirs: verso del campo; pl: polarità della macchia sinistra
function mkTube(zs,sx,dirs,pl){
 const t={zs,sx,dirs,strands:[],arrows:[],spots:[],cross:0,cx:0};
 for(let k=0;k<NS;k++){
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NP*3),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(NP*3),3));
  const ln=new THREE.Line(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.85}));G.add(ln);

 [pl,-pl].forEach(p=>{
  const m=new THREE.Mesh(new THREE.CircleGeometry(1,40),new THREE.MeshBasicMaterial({color:0x1a0d05,transparent:true,opacity:.9}));
  m.add(new THREE.Mesh(new THREE.RingGeometry(1,1.14,48),new THREE.MeshBasicMaterial({color:p>0?0xff5a4a:0x4aa3ff,side:2})));
  m.rotation.x=-Math.PI/2;m.position.y=.01;G.add(m);
  const lb=document.createElement('div');lb.className='lb';lb.style.color=p>0?'#ff8f80':'#7fbcff';lb.style.fontWeight='600';lb.textContent=p>0?'N (+)':'S (−)';document.body.appendChild(lb);

let XM=0;
// zo: semidistanza dei piedi in z; lean: inclinazione delle cime verso l'altro tubo; beta: torsione dell'asse
function updT(t,time,h,w,pr,rf,cx,zo,lean,beta,fl){
 const r0=(.4+.35*pr)*rf,tw=1.5,k=cl((h+D)/TOP),sf=cl(h-HV),pa=.3*cl((h+D)/1.2),zb=t.zs*zo,sb=Math.sin(beta);

 const cross=crossOf(AX,AY),sv=cross>0&&sf>.03,scl=Math.max(.03,Math.min(.8,.15+.65*k)*sf);

 t.spots.forEach((s,i)=>{const xr=(i?1:-1)*cross;s.m.visible=sv;s.m.position.set(cx+xr,.01,zb-t.zs*xr*sb);s.m.scale.setScalar(scl)});
 t.strands.forEach((s,n)=>{
  const p=s.ln.geometry.attributes.position.array,c=s.ln.geometry.attributes.color.array;
  for(let i=0;i<NP;i++){

   const f=cl((y+.5)/3);tc.copy(c1).lerp(c2,Math.min(1,f*1.6)).lerp(c3,Math.max(0,f-.5)*.9);
   if(fl>.01)tc.lerp(wh,cl(1.3*fl*Math.exp(-Math.pow(xw-XM,2)/4-z*z/.6)*cl((y-2)/1.5)));
   c[i*3]=tc.r;c[i*3+1]=tc.g;c[i*3+2]=tc.b}
  s.ln.geometry.attributes.position.needsUpdate=s.ln.geometry.attributes.color.needsUpdate=true;
  let u=(time*.12+s.off)%1;if(t.dirs<0)u=1-u;
  const j=Math.min(NP-2,Math.max(1,Math.floor(u*(NP-1)))),a=(j+1)*3,b=(j-1)*3,m=t.arrows[n];
  m.position.set(p[j*3],p[j*3+1],p[j*3+2]);

 rings.forEach(r=>{const u=(T-TF-.9-(r.ty?1.3:0))/(r.ty?2:2.4);r.m.visible=fOn&&u>0&&u<1;if(r.m.visible){r.m.position.set(r.sp.m.position.x,.07,r.sp.m.position.z);r.m.scale.setScalar(.5+(r.ty?2.5:4.5)*u);r.m.material.opacity=(r.ty?.5:.85)*(1-u)}});

// Cronologia

// Riconnessione: ogni coppia di linee (A_k,B_k) viene tagliata a quota YC0 sulle due gambe e ricucita in modo incrociato:
// due anse basse (A−/B+ e A+/B−) che si accorciano, e un anello chiuso (plasmoide) fatto dalle due parti alte, che sale e si espande
const YC0=3.6;
function mkL(n){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(n*3),3));

const perm=[...Array(NS).keys()].sort(()=>Math.random()-.5);
const pairs=perm.map((r,k)=>({lowL:mkL(170),lowR:mkL(170),ring:mkL(345),snap:null,tk:TF+.2+3*r/NS}));
function mkSeg(){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NS*24),3));g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(NS*24),3));
 const l=new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));l.frustumCulled=false;G.add(l);return l}

function lp(arr,f){const i=Math.max(0,Math.min(NP-2,Math.floor(f))),t=f-i;return[arr[i*3]+(arr[i*3+3]-arr[i*3])*t,arr[i*3+1]+(arr[i*3+4]-arr[i*3+1])*t,arr[i*3+2]+(arr[i*3+5]-arr[i*3+2])*t]}
function segW(l,ix,arr,f0,f1,k,r,g,b){const P=l.geometry.attributes.position.array,C=l.geometry.attributes.color.array,a=lp(arr,f0),c=lp(arr,f1);P.set([a[0],a[1],a[2],c[0],c[1],c[2]],ix*6);C.set([r*k,g*k,b*k,r*k,g*k,b*k],ix*6)}
function clrSeg(k){for(let j=k*4;j<k*4+4;j++){jetD.geometry.attributes.color.array.fill(0,j*6,j*6+6);jetU.geometry.attributes.color.array.fill(0,j*6,j*6+6)}}
function dirv(arr,i,j){const x=arr[j*3]-arr[i*3],y=arr[j*3+1]-arr[i*3+1],z=arr[j*3+2]-arr[i*3+2],n=Math.hypot(x,y,z);return n<1e-4?[0,1,0]:[x/n,y/n,z/n]}

// raccordo liscio (Bézier cubica) tra due estremi, con tangenti d0 (in uscita da a) e d3 (in ingresso in b)
function bez(emit,a,d0,b,d3){const L=.55*Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2])+.01,
 p1=[a[0]+d0[0]*L,a[1]+d0[1]*L,a[2]+d0[2]*L],p2=[b[0]-d3[0]*L,b[1]-d3[1]*L,b[2]-d3[2]*L];

function lowLine(l,pa,pb,i0,i1,right,hot){
 const P=l.geometry.attributes.position.array,C=l.geometry.attributes.color.array;let n=0;
 const emit=(x,y,z)=>{P[n*3]=x;P[n*3+1]=y;P[n*3+2]=z;tc.copy(wh).lerp(c3,hot).multiplyScalar(cl(1+y/1.2));C[n*3]=tc.r;C[n*3+1]=tc.g;C[n*3+2]=tc.b;n++};

// Anello superiore (flux rope): stesse linee ricucite di prima, ma ruotato di 90° attorno alla verticale:
// ribaltato in una U con concavità verso l'alto; la sua curvatura giace nel piano y–z (lo stesso delle anse basse) e il tubo si estende lungo x
function snapRing(pa,pb){

 let mn=1e9,mx=-1e9;for(let i=0;i<n;i++){mn=Math.min(mn,v[i*3+1]);mx=Math.max(mx,v[i*3+1])}

 for(let i=0;i<n;i++){const dx=v[i*3]-cx,dz=v[i*3+2]-cz;o[i*3]=cx+dz*1.6;o[i*3+1]=mn+(mx-v[i*3+1]);o[i*3+2]=cz+dx*.7}

function reconnect(k,q,rk,fin,hm){

 A.arrows[k].visible=B.arrows[k].visible=(k%3===0)&&fin>.4;

 [pa,pb].forEach((arr,ti)=>[0,1].forEach(sd=>{
  const foot=sd?ib:ia,cut=sd?id0:ic0,ix=k*4+ti*2+sd,ku=Math.min(1,u1);

 for(let i=0;i<n;i++){P[i*3]=c[0]+(v[i*3]-c[0])*e;P[i*3+1]=c[1]+(v[i*3+1]-c[1])*e+lift;P[i*3+2]=c[2]+(v[i*3+2]-c[2])*e;C[i*3]=tc.r;C[i*3+1]=tc.g;C[i*3+2]=tc.b}

const flf=v=>v<0?0:Math.min(1,1.4*(1-Math.exp(-4*v))*Math.exp(-v/2.8));
function st(t0,dd){const e=sm((T-t0)/DUR);if(dd<=0)return{h:HMAX*e,w:1.5+.7*e,pr:e,rf:.8+.2*sm((T-t0)/6)};const s1=sm(dd);return{h:HMAX*(1-s1),w:2.2,pr:1,rf:1-.2*s1}}
const ph=document.getElementById('ph'),l1=document.getElementById('l1'),lf=document.getElementById('lf');
function proj(v,el,dx,dy){const q=v.clone();G.localToWorld(q);q.project(cam);el.style.left=(q.x*.5+.5)*innerWidth+dx+'px';el.style.top=(-q.y*.5+.5)*innerHeight+dy+'px'}
function loop(now){

 const dt=Math.min(.1,(now-last)/1000);last=now;
 if(!paused){const sp=+document.getElementById('s').value;T+=dt*sp;clk+=dt*sp}

 const dd=Math.max(0,(T-TD)/DEC);
