  try { init(); } catch(e){
    document.getElementById('errbox').style.display = 'flex';
    document.getElementById('errbox').innerHTML = 'Errore nella scena 3D: ' + e.message;
    console.error(e);
  }
});

function init(){
  var mount = document.getElementById('mount');
  var width = mount.clientWidth;
  var height = mount.clientHeight;

  var scene = new THREE.Scene();
  scene.background = null;

  var camera = new THREE.PerspectiveCamera(42, width/height, 1, 5000);

  var renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  mount.appendChild(renderer.domElement);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 150, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 60;
  controls.maxDistance = 1400;

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  var dl = new THREE.DirectionalLight(0xffffff, 0.85);
  dl.position.set(250, 500, 300);
  scene.add(dl);
  var dl2 = new THREE.DirectionalLight(0xffe8c0, 0.3);
  dl2.position.set(-200, 200, -200);
  scene.add(dl2);

  var granuloTopY = 70;                      
  var granuloBottomY = -30;                  
  var hTotal = granuloTopY - granuloBottomY; 
  
  var rCyl = 45;                             
  var crownThickTop = 16;                    
  var crownThickBottom = 6;                  

  var colX = rCyl + crownThickTop * 0.5;        
  var colZ = 0;
  
  var footY = 70;                            
  var neckY = 340;                           
  var shockTopY = 390;                       
  
  var radiusFoot = crownThickTop;            
  var radiusTopTube = 28;                    
  
  var baseGroup = new THREE.Group();
  baseGroup.position.set(0, 0, 0);
  scene.add(baseGroup);

  // Funzione di fabbrica: costruisce un'unità "granulo" con lo stesso profilo
  // di quello centrale (cilindro pieno + corona conica per il canale di
  // discesa), riutilizzata sia per il granulo principale sia per i granuli
  // vicini, così hanno tutti la stessa identica forma (solo a scala diversa).
  // Ritorna anche i riferimenti a corpo/corona, utili per animare l'opacità.
  function buildGranuloUnit(bodyColor, crownColorHex){
    var body = new THREE.Mesh(granuloGeo, new THREE.MeshStandardMaterial({ color:bodyColor, roughness:0.85, transparent:true, opacity:1 }));
    body.position.set(0, (granuloTopY + granuloBottomY)/2, 0);

    var crown = new THREE.Mesh(crownGeo, new THREE.MeshStandardMaterial({
      color:crownColorHex, roughness:0.8, transparent:true, opacity:0.75, side:THREE.DoubleSide
    }));
    crown.position.set(0, (granuloTopY + granuloBottomY)/2, 0);

    var unit = new THREE.Group();
    unit.add(body);
    unit.add(crown);
    return { unit:unit, body:body, crown:crown };
  }

  // 1. Granulo centrale: cilindrico
  var granuloGeo = new THREE.CylinderGeometry(rCyl, rCyl, hTotal, 32, 1, false);

  // 2. Canale freddo: conico
  var rCrownTop = rCyl + crownThickTop;
  var rCrownBottom = rCyl + crownThickBottom;
  var crownGeo = new THREE.CylinderGeometry(rCrownTop, rCrownBottom, hTotal, 32, 1, true);

  var mainGranulo = buildGranuloUnit(0xf3b9a1, 0xb45309);

  // Il granulo principale viene racchiuso in un gruppo la cui scala (isotropa,
  // su tutti e tre gli assi) viene ridotta man mano che i granuli vicini,
  // disposti in cerchio, crescono premendo da ogni lato: non più uno
  // schiacciamento direzionale ma un vero collasso verso la scomparsa.
  // Il ciclo è sincronizzato con quello del pistone/onda (PISTON_PERIOD_MS):
  // il granulo è al massimo della contrazione proprio quando parte il
  // pistone e l'onda comincia a risalire — il nesso causale "canale che si
  // restringe -> caduta accelerata -> onda" diventa esplicito.
  var squeezeGroup = new THREE.Group();
  squeezeGroup.add(mainGranulo.unit);
  baseGroup.add(squeezeGroup);

  var nNeighbors = 4;                              // granuli vicini, disposti in cerchio
  var neighborBaseScale = 0.6;                     // diametro massimo dei vicini rispetto al granulo centrale
  var neighborDistMax = rCyl + crownThickTop*1.3;  // distanza dal centro quando sono "germoglio" (piccoli)
  var neighborDistMin = rCyl * 0.55;               // distanza dal centro quando sono cresciuti al massimo: si stringono molto di più
  var neighborAngleOffset = Math.PI/4;             // sfalsati di 45° per non allinearsi col tubo (lungo +x)

  var neighborUnits = [];
  for (var ng=0; ng<nNeighbors; ng++){
    var ngAngle = neighborAngleOffset + (ng/nNeighbors)*Math.PI*2;
    var ngUnit = buildGranuloUnit(0xeda98d, 0xc9721c);
    ngUnit.unit.userData.angle = ngAngle;
    ngUnit.unit.position.set(Math.cos(ngAngle)*neighborDistMax, 0, Math.sin(ngAngle)*neighborDistMax);
    ngUnit.unit.scale.setScalar(0.001);
    baseGroup.add(ngUnit.unit);
    neighborUnits.push(ngUnit.unit);
  }

  var SQUEEZE_MAX = 0.85;             // quanto si contrae il granulo al culmine del collasso (1 = invariato, vicino a 1 = quasi sparito)
  var CENTRAL_MIN_OPACITY = 0.4;      // opacità del granulo centrale al culmine del collasso
  var NEIGHBOR_MIN_SCALE = 0.35;      // diametro minimo "germoglio" dei vicini (alzato: restano tozzi anche da piccoli)
  var NEIGHBOR_MAX_SCALE = 1.0;       // diametro massimo dei vicini
  var SQUEEZE_LAG_MS = 2100;          // l'onda parte ancora più presto: il granulo è meno collassato in quel momento,
                                       // di restringimento del canale (non al culmine, dove il collasso
                                       // rallenta ed è quasi fermo), continuando poi a collassare del tutto

  var downArrowMat = new THREE.MeshBasicMaterial({ color:0x2f6f95 });
  var downArrowGeo = new THREE.ConeGeometry(2.5, 9, 8);
  var downArrows = [];
  var nDownArrows = 4;
  for (var da=0; da<nDownArrows; da++){
    var arrow = new THREE.Mesh(downArrowGeo, downArrowMat);
    arrow.rotation.x = Math.PI;
    arrow.userData.phase = da/nDownArrows;
    var angle = (da / nDownArrows) * Math.PI * 2;
    var arrDist = rCyl + crownThickTop * 0.5;
    arrow.position.set(Math.cos(angle)*arrDist, 20, Math.sin(angle)*arrDist);
    squeezeGroup.add(arrow);
    downArrows.push(arrow);
  }

  var piedeGeo = new THREE.CylinderGeometry(radiusFoot*0.5, radiusFoot*0.5, 5, 24);
  var piedeMat = new THREE.MeshStandardMaterial({ color:0x2c1c12, roughness:0.7 });
  var piedeMesh = new THREE.Mesh(piedeGeo, piedeMat);
  piedeMesh.position.set(colX, footY, colZ);
  scene.add(piedeMesh);

  var tubeHeight = neckY - footY;
  var tubeGeo = new THREE.CylinderGeometry(radiusTopTube, radiusFoot, tubeHeight, 28, 1, true);
  var tubeMat = new THREE.MeshStandardMaterial({
    color:0xefe6d8, roughness:0.6, metalness:0.02,
    transparent:true, opacity:0.35, side:THREE.DoubleSide
  });
  var tubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
  tubeMesh.position.set(colX, (footY+neckY)/2, colZ);
  scene.add(tubeMesh);

  // 3. Fibrille in cima
  var fibrilGroup = new THREE.Group();
  fibrilGroup.position.set(colX, (neckY + shockTopY)/2, colZ);
  scene.add(fibrilGroup);

  var uniformFibrilRadius = radiusTopTube * 1.05; 
  var sideSpacing = 88;                 // più distanziate: evita che si tocchino durante la curva

  // Ogni fibrilla è costruita come una catena di segmenti cilindrici SOLIDI
  // (ognuno con le proprie basi piene, THREE.CylinderGeometry classico) che
  // seguono il percorso: un tratto rettilineo, una curva dolce (arco di
  // cerchio a raggio grande, suddiviso in molti piccoli segmenti così la
  // piegatura resta morbida), poi un secondo tratto rettilineo. Concatenando
  // veri cilindri (invece di un TubeGeometry con frame di Frenet, che con
  // curve miste rette/curve può torcersi e apparire come un nastro piatto)
  // si ottiene un tubo davvero pieno e rotondo, con le estremità tagliate di
  // netto (le basi piatte dei cilindri) invece di cupole posticce.
  // Tutto resta nel piano orizzontale y=0 (locale al gruppo). Le tre fibrille
  // condividono verso e geometria di curvatura (solo traslate sull'offsetX),
  // quindi restano parallele e a distanza costante fra loro.
  var fibrilStraightLen1 = 170;               // primo tratto rettilineo
  var fibrilBendRadius   = 260;                // raggio grande = curva dolce
  var fibrilBendAngle    = 25 * Math.PI/180;   // ampiezza della curva (~25°)
  var fibrilStraightLen2 = 100;                // secondo tratto rettilineo, dopo la curva
  var fibrilCurveSign    = 1;                  // verso comune di curvatura per tutte e tre
  var fibrilArcSteps     = 12;                 // suddivisioni dell'arco: più alto = curva più liscia

  function computeFibrilPathPoints(offsetX){
    var half = fibrilStraightLen1 / 2;
    var pts = [
      new THREE.Vector3(offsetX, 0, -half),
      new THREE.Vector3(offsetX, 0, half)     // fine tratto rettilineo 1 / inizio arco
    ];

    var R = fibrilBendRadius, theta = fibrilBendAngle;
    var centerX = offsetX + fibrilCurveSign*R;
    for (var i=1; i<=fibrilArcSteps; i++){
      var a = theta * (i/fibrilArcSteps);
      var x = centerX - fibrilCurveSign*R*Math.cos(a);
      var z = half + R*Math.sin(a);
      pts.push(new THREE.Vector3(x, 0, z));
    }

    var xEnd = centerX - fibrilCurveSign*R*Math.cos(theta);
    var zEnd = half + R*Math.sin(theta);
    var dirX = fibrilCurveSign*Math.sin(theta);
    var dirZ = Math.cos(theta);
    pts.push(new THREE.Vector3(xEnd + dirX*fibrilStraightLen2, 0, zEnd + dirZ*fibrilStraightLen2));

    return pts;
  }

  function buildSolidPipe(points, radius, material){
    var group = new THREE.Group();
    var upAxis = new THREE.Vector3(0, 1, 0);
    for (var i=0; i<points.length-1; i++){
      var p0 = points[i], p1 = points[i+1];
      var dir = new THREE.Vector3().subVectors(p1, p0);
      var len = dir.length();
      if (len < 1e-6) continue;
      dir.normalize();
      var geo = new THREE.CylinderGeometry(radius, radius, len, 16, 1, false); // basi piene, tagliate di netto
      var mesh = new THREE.Mesh(geo, material);
      mesh.position.copy(p0).addScaledVector(dir, len/2);
      mesh.quaternion.setFromUnitVectors(upAxis, dir);
      group.add(mesh);
    }
    return group;
  }

  function buildFibrilMesh(offsetX, material){
    var pathPoints = computeFibrilPathPoints(offsetX);
    return buildSolidPipe(pathPoints, uniformFibrilRadius, material);
  }

  // Dati di percorso (con lunghezze cumulative) per far scorrere le frecce
  // di flusso lungo l'asse di ciascuna fibrilla, dal tratto rettilineo verso
  // quello curvo.
  function buildPathData(points){
    var cum = [0];
    for (var i=1; i<points.length; i++){
      cum.push(cum[i-1] + points[i].distanceTo(points[i-1]));
    }
    return { points:points, cum:cum, total:cum[cum.length-1] };
  }

  function samplePathData(pathData, t){
    var target = t * pathData.total;
    var pts = pathData.points, cum = pathData.cum;
    for (var i=1; i<pts.length; i++){
      if (target <= cum[i] || i === pts.length-1){
        var segLen = cum[i] - cum[i-1];
        var f = segLen > 1e-6 ? (target - cum[i-1]) / segLen : 0;
        f = Math.max(0, Math.min(1, f));
        return {
          pos: new THREE.Vector3().lerpVectors(pts[i-1], pts[i], f),
          dir: new THREE.Vector3().subVectors(pts[i], pts[i-1]).normalize()
        };
      }
    }
    return { pos: pts[pts.length-1].clone(), dir: new THREE.Vector3(0,0,1) };
  }

  var flowArrowUp = new THREE.Vector3(0, 1, 0);
  var flowArrowMat = new THREE.MeshBasicMaterial({ color:0x2a1a10 });
  var flowArrowGeo = new THREE.ConeGeometry(4.2, 15, 10);
  var FIBRIL_FLOW_PERIOD_MS = 1800; // tempo per percorrere l'intera fibrilla
  var fibrilFlowArrows = [];

  function addFlowArrows(offsetX, count){
    var pathData = buildPathData(computeFibrilPathPoints(offsetX));
    for (var k=0; k<count; k++){
      var mesh = new THREE.Mesh(flowArrowGeo, flowArrowMat);
      fibrilGroup.add(mesh);
      fibrilFlowArrows.push({ mesh:mesh, pathData:pathData, phase:k/count });
    }
  }

  var centralFibrilMat = new THREE.MeshStandardMaterial({ color:0x8b4a34, roughness:0.6, transparent:true, opacity:0.92 });
  fibrilGroup.add(buildFibrilMesh(0, centralFibrilMat));
  addFlowArrows(0, 3);

  var sideFibrilMat = new THREE.MeshStandardMaterial({ color:0xd97736, roughness:0.6, transparent:true, opacity:0.85 });
  fibrilGroup.add(buildFibrilMesh(-sideSpacing, sideFibrilMat));
  addFlowArrows(-sideSpacing, 3);
  fibrilGroup.add(buildFibrilMesh(sideSpacing, sideFibrilMat));
  addFlowArrows(sideSpacing, 3);

  var waveMat = new THREE.MeshBasicMaterial({ color:0xb5651d, transparent:true, opacity:0.95 });
  var waveMesh = null;
  var WAVE_SEGMENTS = 22;
  var AMP_BASE = 2;
  var AMP_GROWTH = 18;
  var waveRadius = 1.6;

  var PISTON_PERIOD_MS     = 6000;
  var WAVE_TRAVEL_MS       = 3200;
  var SHOCK_HOLD_MS        = 1000;
  var DARKEN_TRANSITION_MS = 250;
  var PISTON_BOUNCE_MS     = 500;

  var currentCycleIndex = -1;
  var waveJitter = [];
  function ensureJitterForCycle(cycleIdx){
    if (cycleIdx === currentCycleIndex) return;
    currentCycleIndex = cycleIdx;
    waveJitter = [];
    for (var j=0; j<=WAVE_SEGMENTS; j++){
      waveJitter.push(0.75 + Math.random()*0.5);
    }
  }

  function pistonOffset(tInCycle){
    if (tInCycle > PISTON_BOUNCE_MS) return 0;
    return -Math.sin(Math.PI * tInCycle/PISTON_BOUNCE_MS) * 8;
  }

  function waveOpacity(tInCycle){
    if (tInCycle <= WAVE_TRAVEL_MS) return 0.95;
    var tAfter = tInCycle - WAVE_TRAVEL_MS;
    if (tAfter < DARKEN_TRANSITION_MS) return 0.95*(1 - tAfter/DARKEN_TRANSITION_MS);
    return 0;
  }

  function buildWaveGeometry(frontProgress, cycleIdx){
    ensureJitterForCycle(cycleIdx);
    var pts = [];
    var frontY = footY + frontProgress*(neckY-footY);
    for (var s=0; s<=WAVE_SEGMENTS; s++){
      var yFrac = s/WAVE_SEGMENTS;
      var y = footY + yFrac*(frontY-footY);
      var amp = AMP_BASE + AMP_GROWTH*yFrac*yFrac;
      var sign = (s % 2 === 0) ? 1 : -1;
      var jitter = waveJitter[s] || 1;
      var x = colX + sign*amp*jitter;
      pts.push(new THREE.Vector3(x, y, colZ));
    }
    if (pts.length < 2) return null;
    var curve = new THREE.CatmullRomCurve3(pts);
    return new THREE.TubeGeometry(curve, Math.max(8, WAVE_SEGMENTS), waveRadius, 6, false);
  }

  var views = {
    top:  { pos:[0, 560, 1],   target:[0,120,0] },
    iso:  { pos:[450, 260, 380], target:[0,150,0] },
    side: { pos:[0, 150, 600],  target:[0,150,0] }
  };

  function setView(name){
    var v = views[name];
    camera.position.set(v.pos[0], v.pos[1], v.pos[2]);
    controls.target.set(v.target[0], v.target[1], v.target[2]);
    controls.update();
    var btns = document.querySelectorAll('.panel button');
    for (var k=0;k<btns.length;k++) btns[k].classList.remove('active');
    var b = document.getElementById('btn-'+name);
    if (b) b.classList.add('active');
  }
  setView('iso');

  document.getElementById('btn-top').addEventListener('click', function(){ setView('top'); });
  document.getElementById('btn-iso').addEventListener('click', function(){ setView('iso'); });
  document.getElementById('btn-side').addEventListener('click', function(){ setView('side'); });

  var autoSpin = false;
  var spinBtn = document.getElementById('btn-spin');
  spinBtn.addEventListener('click', function(){
    autoSpin = !autoSpin;
    spinBtn.textContent = 'Rotazione auto: ' + (autoSpin ? 'on' : 'off');
    spinBtn.classList.toggle('active', autoSpin);
  });

  function animate(){
    requestAnimationFrame(animate);
    try {
      if (autoSpin){
        var tt = performance.now()*0.0002;
        var radius = camera.position.distanceTo(controls.target);
        camera.position.x = controls.target.x + radius*Math.sin(tt);
        camera.position.z = controls.target.z + radius*Math.cos(tt);
      }

      var now = performance.now();
      var cycleIdx = Math.floor(now / PISTON_PERIOD_MS);
      var tInCycle = now - cycleIdx*PISTON_PERIOD_MS;

      var offY = pistonOffset(tInCycle);
      piedeMesh.position.y = footY + offY;

      // Collasso isotropo del granulo, sincronizzato col ciclo del pistone.
      // I granuli vicini in cerchio crescono in sincrono, causando il collasso.
      var squeezeAmt = 0.5*(1 + Math.cos(2*Math.PI*(tInCycle - SQUEEZE_LAG_MS)/PISTON_PERIOD_MS));
      var centralScale = 1 - squeezeAmt*SQUEEZE_MAX;
      squeezeGroup.scale.set(centralScale, 1, centralScale); // solo diametro, niente abbassamento in altezza
      // Il disco nero (piedeMesh) e il tubo/cono verticale restano completamente
      // fermi, come nel file originale. È il granulo (squeezeGroup) a
      // spostarsi in x mentre si restringe, in modo che il suo bordo vicino
      // resti sempre ancorato alla posizione fissa del disco/tubo: il lato
      // opposto invece si allontana sempre di più, dando l'idea del collasso.
      squeezeGroup.position.x = colX * (1 - centralScale);
      mainGranulo.body.material.opacity = 1 - squeezeAmt*(1-CENTRAL_MIN_OPACITY);

      // I granuli vicini: mentre crescono si stringono di più sul granulo
      // centrale (la distanza dal centro diminuisce), e la loro altezza
      // arriva fino a eguagliare quella del granulo centrale (scala y fino
      // a 1), mentre il diametro resta comunque più piccolo (neighborBaseScale).
      var neighborDiameterScale = neighborBaseScale * (NEIGHBOR_MIN_SCALE + (NEIGHBOR_MAX_SCALE-NEIGHBOR_MIN_SCALE)*squeezeAmt);
      var neighborHeightScale = 1; // altezza piena fin dall'inizio, come il granulo centrale: cambia solo il diametro
      var neighborDistNow = neighborDistMax - (neighborDistMax-neighborDistMin)*squeezeAmt;
      for (var nu=0; nu<neighborUnits.length; nu++){
        var ngu = neighborUnits[nu];
        ngu.scale.set(neighborDiameterScale, neighborHeightScale, neighborDiameterScale);
        var ngAngleNow = ngu.userData.angle;
        ngu.position.set(squeezeGroup.position.x + Math.cos(ngAngleNow)*neighborDistNow, 0, Math.sin(ngAngleNow)*neighborDistNow);
      }

      for (var da2=0; da2<downArrows.length; da2++){
        var arrTop = granuloTopY - 10;
        var arrBottom = granuloBottomY + 10;
        var tt2 = ((now*0.00035) + downArrows[da2].userData.phase) % 1;
        downArrows[da2].position.y = arrTop + (arrBottom-arrTop)*tt2;
      }

      for (var fa=0; fa<fibrilFlowArrows.length; fa++){
        var flowItem = fibrilFlowArrows[fa];
        var tFlow = ((now/FIBRIL_FLOW_PERIOD_MS) + flowItem.phase) % 1;
        var sample = samplePathData(flowItem.pathData, tFlow);
        flowItem.mesh.position.copy(sample.pos);
        flowItem.mesh.quaternion.setFromUnitVectors(flowArrowUp, sample.dir);
      }

      var frontProgress = Math.min(1, tInCycle/WAVE_TRAVEL_MS);
      var newWaveGeo = buildWaveGeometry(frontProgress, cycleIdx);
      if (waveMesh){ scene.remove(waveMesh); waveMesh.geometry.dispose(); }
      if (newWaveGeo){
        waveMat.opacity = waveOpacity(tInCycle);
        waveMesh = new THREE.Mesh(newWaveGeo, waveMat);
        scene.add(waveMesh);
      } else {
        waveMesh = null;
      }

      controls.update();
      renderer.render(scene, camera);
    } catch(errFrame){}
  }
  animate();

  window.addEventListener('resize', function(){
    width = mount.clientWidth;
    height = mount.clientHeight;
    camera.aspect = width/height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  });
}
</script>
</body>
</html>
