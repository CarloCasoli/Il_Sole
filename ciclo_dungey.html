<script>
'use strict';
/* =====================================================================
   Coordinate: piano mezzogiorno–mezzanotte (x verso il Sole, z verso Nord),
   unità = raggio terrestre. In Three.js: (−x, z, y) con y verso il tramonto.
   ===================================================================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const sst=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t)};
const ease=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const win=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const PI=Math.PI;

/* ---------- Magnetopausa di Shue et al. (1998) ---------- */
function shue(Bz,Dp){return{r0:(10.22+1.29*Math.tanh(0.184*(Bz+8.14)))*Math.pow(Dp,-1/6.6),al:(0.58-0.007*Bz)*(1+0.024*Math.log(Dp))}}

/* ---------- Modello del campo: funzione di flusso A(x,z); le linee di campo sono le curve A = costante ----------
   Bz sud : dipolo + campo del vento antiparallelo (linea X sul lato giorno a r0) + coda con lobi (linea X a 25 R⊕)
   Bz nord: dipolo + campo del vento parallelo (magnetosfera chiusa, punti neutri sopra le cuspidi)          */
const M={r0:9.8,al:.62,w:1,d:1.5,rxn:25,s:5,x0:-95,dx:.25,n:0,R:null,BL:null};
function Gz(z){const a=Math.abs(z),d=M.d;return a+d*Math.log1p(Math.exp(-2*a/d))-d*Math.LN2}
function buildModel(r0,al,w){
  M.r0=r0;M.al=al;M.w=w;
  M.kd=1/(2*r0*r0*r0);M.g=(M.s*M.s+M.rxn*M.rxn)/(2*M.rxn**3);M.kN=1/(r0*r0*r0);M.kNn=M.kN/6;
  M.Axd=1.5/r0;M.Axn=1/M.rxn+M.g*Math.log(1+M.rxn*M.rxn/(M.s*M.s));
  const T=[];for(let i=0;i<=600;i++){const th=i/600*3.125,r=r0*Math.pow(2/(1+Math.cos(th)),al);T.push([r*Math.cos(th),r*Math.sin(th)])}
  M.mp=T;
  M.n=Math.round((r0+1-M.x0)/M.dx)+1;M.R=new Float32Array(M.n);M.BL=new Float32Array(M.n);
  let j=0;
  for(let i=0;i<M.n;i++){const x=M.x0+i*M.dx;M.R[i]=rmpRaw(x)}
  for(let i=0;i<M.n;i++){const x=M.x0+i*M.dx,xc=Math.min(x,-.5),Rc=rmpAt(xc),r2=xc*xc+Rc*Rc;
    const num=xc*xc/(r2*Math.sqrt(r2))+M.g*Math.log(1+xc*xc/(M.s*M.s));M.BL[i]=num/Gz(Rc)}
}
function rmpRaw(x){const T=M.mp;if(x>=T[0][0])return 0;for(let i=1;i<T.length;i++){if(T[i][0]<=x){const a=T[i-1],b=T[i],f=(x-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*f}}return T[T.length-1][1]}
function tab(arr,x){let f=(x-M.x0)/M.dx;if(f<=0)return arr[0];if(f>=M.n-1)return arr[M.n-1];const i=f|0;f-=i;return arr[i]+(arr[i+1]-arr[i])*f}
function rmpAt(x){return x>=M.r0?0:tab(M.R,x)}
function A(x,z){
  const r2=x*x+z*z;let a=x*x/(r2*Math.sqrt(r2));
  if(x>0)a+=(M.w*M.kd-(1-M.w)*M.kN)*x*x;
  else{a+=M.g*Math.log(1+x*x/(M.s*M.s))}
  if(x<2){const T=sst(2,-12,x);if(T>0)a-=T*tab(M.BL,x)*Gz(z)}
  return a}
function grad(x,z){const h=1e-3*(1+.03*Math.hypot(x,z));return[(A(x+h,z)-A(x-h,z))/(2*h),(A(x,z+h)-A(x,z-h))/(2*h)]}

/* ---------- Tracciamento delle linee (curve di livello) ---------- */
const XMIN=-86,XMAX=31,ZMAX=46;
function trace(a,x,z,dir,maxS){
  const pts=[[x,z]],sx=x,sz=z;let end='max';
  for(let i=0;i<maxS;i++){
    const r=Math.hypot(x,z),ds=clamp(.03*r,.02,.7);
    let[gx,gz]=grad(x,z),gn=Math.hypot(gx,gz)||1e-12;
    const mx=x-gz/gn*dir*ds*.5,mz=z+gx/gn*dir*ds*.5;
    [gx,gz]=grad(mx,mz);gn=Math.hypot(gx,gz)||1e-12;
    x+=-gz/gn*dir*ds;z+=gx/gn*dir*ds;
    const f=A(x,z)-a;[gx,gz]=grad(x,z);const g2=gx*gx+gz*gz;
    if(g2>1e-16){let cx=f*gx/g2,cz=f*gz/g2;const cn=Math.hypot(cx,cz);if(cn>ds*.5){cx*=ds*.5/cn;cz*=ds*.5/cn}x-=cx;z-=cz}
    if(x*x+z*z<1){const rr=Math.hypot(x,z);pts.push([x/rr,z/rr]);end='earth';break}
    pts.push([x,z]);
    if(x<XMIN||x>XMAX||Math.abs(z)>ZMAX){end='out';break}
    if(i>40&&Math.hypot(x-sx,z-sz)<ds*1.2){end='loop';break}
  }
  return{pts,end}}
function traceFrom(a,p,out){
  if(!p)return null;const[x,z]=p;const[gx,gz]=grad(x,z);let dir=1;
  if(out&&(-gz*x+gx*z)<0)dir=-1;
  const f=trace(a,x,z,dir,3500);let pts=f.pts,ends=['start',f.end];
  if(f.end!=='loop'){const b=trace(a,x,z,-dir,3500);pts=b.pts.reverse().concat(f.pts.slice(1));ends=[b.end,f.end]}
  const ne=ends.filter(e=>e==='earth').length;
  return{pts,earth:ne}}
function bis(f,a,b){let fa=f(a),fb=f(b);if(fa*fb>0)return null;for(let i=0;i<46;i++){const m=(a+b)/2,fm=f(m);if(fa*fm<=0){b=m;fb=fm}else{a=m;fa=fm}}return(a+b)/2}
const QR={nd:[.002,PI/2-.002],nn:[PI/2+.002,PI-.002],sd:[-PI/2+.002,-.002],sn:[-PI+.002,-PI/2-.002]};
function foot(a,q){const r=QR[q],ph=bis(p=>A(Math.cos(p),Math.sin(p))-a,r[0],r[1]);return ph==null?null:[Math.cos(ph),Math.sin(ph)]}
function eqRoot(a,x1,x2){const x=bis(x=>A(x,0)-a,x1,x2);return x==null?null:[x,0]}
function edgeRoot(a,xe,s){const R=rmpAt(xe)+.5,z=bis(z=>A(xe,z)-a,R,ZMAX-1);return z==null?null:[xe,s*z]}
function lineFoot(a,q){return traceFrom(a,foot(a,q),true)}
function resample(pts,N){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const tot=L[L.length-1]||1,out=[];let j=1;for(let k=0;k<N;k++){const s=tot*k/(N-1);while(j<pts.length-1&&L[j]<s)j++;const f=(s-L[j-1])/((L[j]-L[j-1])||1);out.push([lerp(pts[j-1][0],pts[j][0],f),lerp(pts[j-1][1],pts[j][1],f)])}return out}
function blend(p,q,w){return p.map((a,i)=>[lerp(a[0],q[i][0],w),lerp(a[1],q[i][1],w)])}

/* ---------- Three.js ---------- */
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0x05070d);
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,1,.1,2000);
const ctl=new THREE.OrbitControls(cam,cv);ctl.enableDamping=true;ctl.dampingFactor=.12;ctl.zoomSpeed=.8;
let userCam=false;ctl.addEventListener('start',()=>{userCam=true});
const V3=(x,z,az=0)=>new THREE.Vector3(-x*Math.cos(az),z,x*Math.sin(az));
S.add(new THREE.AmbientLight(0xffffff,.14));const sun=new THREE.DirectionalLight(0xffffff,1.15);sun.position.set(-100,0,0);S.add(sun);

// stelle
{const g=new THREE.BufferGeometry(),p=[];for(let i=0;i<900;i++){const u=Math.random()*2-1,t=Math.random()*2*PI,r=900;p.push(r*Math.sqrt(1-u*u)*Math.cos(t),r*u,r*Math.sqrt(1-u*u)*Math.sin(t))}
g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));S.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x8890a8,size:1.2,sizeAttenuation:false})))}

// Terra
function earthTex(){const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');
  x.fillStyle='#1c4f8c';x.fillRect(0,0,512,256);let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<70;i++){const cx=rnd()*512,cy=40+rnd()*176,rr=8+rnd()*28;x.fillStyle=rnd()<.6?'#3c7a45':'#8a7a4c';x.beginPath();x.ellipse(cx,cy,rr*1.6,rr,rnd()*3,0,7);x.fill()}
  x.fillStyle='#eef4f8';x.fillRect(0,0,512,22);x.fillRect(0,236,512,20);return new THREE.CanvasTexture(c)}
const earth=new THREE.Mesh(new THREE.SphereGeometry(1,48,32),new THREE.MeshPhongMaterial({map:earthTex(),shininess:8}));S.add(earth);

// texture di bagliore
function glowTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.2,'rgba(255,240,190,.85)');g.addColorStop(.5,'rgba(255,190,90,.25)');g.addColorStop(1,'rgba(255,150,40,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
const GT=glowTex();
function mkSprite(col){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,color:col,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,depthTest:false}));s.visible=false;S.add(s);return s}
const fl=[mkSprite(0xffffff),mkSprite(0xffffff),mkSprite(0xffffff)];   // lampi nei punti X
const sheet=mkSprite(0xffe9a8);                                        // foglio di corrente

// superfici: magnetopausa e onda d'urto (metà verso l'alba, per non coprire il piano)
const surf=new THREE.Group();S.add(surf);
function lathe(prof,col,op){const nb=36,g=new THREE.BufferGeometry(),pos=[],idx=[];
  prof.forEach(([x,rho])=>{for(let j=0;j<=nb;j++){const b=PI/2+PI*j/nb;pos.push(-x,rho*Math.cos(b),rho*Math.sin(b))}});
  for(let i=0;i<prof.length-1;i++)for(let j=0;j<nb;j++){const a=i*(nb+1)+j,b=a+nb+1;idx.push(a,b,a+1,b,b+1,a+1)}
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  return new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,side:THREE.DoubleSide,depthWrite:false}))}
function outline(prof,col,op){const g=new THREE.Group();[1,-1].forEach(s=>{const pts=prof.map(([x,r])=>V3(x,s*r));g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:op})))});return g}
let mpProf=[],bsProf=[];
function buildSurfaces(){
  surf.children.slice().forEach(o=>{surf.remove(o);o.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose()})});
  mpProf=[];for(const[x,r]of M.mp){if(x<XMIN)break;mpProf.push([x,r])}
  bsProf=[];const b0=1.3*M.r0,e=.92;for(let i=0;i<=300;i++){const th=i/300*2.6,r=b0*(1+e)/(1+e*Math.cos(th)),x=r*Math.cos(th);if(x<XMIN)break;bsProf.push([x,r*Math.sin(th)])}
  surf.userData.mpS=lathe(mpProf,0xb98cff,.075);surf.userData.bsS=lathe(bsProf,0xff9f5a,.04);
  surf.add(surf.userData.mpS,surf.userData.bsS,outline(mpProf,0xc9a2ff,.75),outline(bsProf,0xffa766,.45));
  // bagliore dei lobi: la sua intensità segue il campo magnetico nei lobi
  surf.userData.lobes=[1,-1].map(sg=>{const sh=new THREE.Shape(),xs=[];for(let x=-14;x>=XMIN;x-=1)xs.push(x);
    sh.moveTo(4,sg*2.5);xs.forEach(x=>sh.lineTo(-x,sg*1.6));xs.slice().reverse().forEach(x=>sh.lineTo(-x,sg*rmpAt(x)*.96));sh.lineTo(4,sg*2.5);
    const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshBasicMaterial({color:0x37e08a,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));surf.add(m);return m});
  setViewVis()}

// plasma sheet
const psheet=new THREE.Mesh(new THREE.BoxGeometry(78,1,30),new THREE.MeshBasicMaterial({color:0xff9a55,transparent:true,opacity:.1,depthWrite:false,blending:THREE.AdditiveBlending}));
psheet.position.set(47,0,0);S.add(psheet);

// stato del riquadro del polo e degli effetti
const FX={phi:.45,cap:null,dayA:0,nightA:0,cuspA:0,foot:null,trail:[],flash:[],sheet:0,ps:1.6,plasmoid:-1,south:true};
function colDay(fp){const lm=Math.atan2(Math.abs(fp[1]),Math.abs(fp[0])),lb=Math.acos(Math.sqrt(M.Axd));return(PI/2-lm)/(PI/2-lb)*(capColat(FX.phi)-3)}
function colNight(fp){const lm=Math.atan2(Math.abs(fp[1]),Math.abs(fp[0])),lb=Math.acos(Math.sqrt(M.Axn));return(PI/2-lm)/(PI/2-lb)*(capColat(FX.phi)+3)}

function stateSouth(p,t){
  const o={lines:[],fl:[],foot:null,phi:.45,dayA:0,nightA:0,cuspA:0,sheet:0,ps:1.6,plasmoid:-1,jets:[],arrows:[],tags:[],press:0,streams:[]};
  const Axd=M.Axd,Axn=M.Axn,eT=ease(t);
  const dayPair=a=>{const h=lineFoot(a,'nd');o.lines.push({...h,kind:'hero'});o.foot={col:colDay(h.pts[0]),mlt:12};return h};
  if(p<=2){const a=p===0?Axd+.03:p===1?lerp(Axd+.03,Axd+.012,eT):lerp(Axd+.02,Axd+.0004,eT);
    dayPair(a);const y=traceFrom(a,eqRoot(a,M.r0+.02,XMAX-.4),true);if(y)o.lines.push({...y,kind:'imf'});
    if(p===2)o.sheet=eT;o.phi=.45;
    o.arrows.push(AR(M.r0+2.8,-2.6,0,-1,3.2,0xffd34d),AR(M.r0-2.6,-6,0,1,3.2,0x5fb3ff));o.tags.push({v:V3(M.r0+.1,-7.6),t:p===2?'versi opposti: si avvicinano':'versi opposti',c:'#ffffff'})}
  else if(p===3){const a=lerp(Axd-.0004,Axd*.75,eT);dayPair(a);o.lines.push({...lineFoot(a,'sd'),kind:'twin'});
    const f=win(t,0,.35);o.fl.push({x:M.r0,z:0,k:Math.sin(PI*f)*1.0});o.sheet=1-win(t,0,.2);
    if(t>.04&&t<.75)o.jets.push(['day',3]);if(t>.3&&t<.9)o.jets.push(['cusp',1]);
    o.dayA=Math.sin(PI*win(t,.25,1));o.phi=lerp(.45,.52,eT);
    if(t>.12&&t<.85){const h=heroOf(o),w2=twinOf(o);o.streams.push({line:'hero',u0:uNear(h.pts,[M.r0,0]),u1:.005,rate:16,dur:1.4,col:CSH},{line:'twin',u0:uNear(w2.pts,[M.r0,0]),u1:.005,rate:16,dur:1.4,col:CSH})}}
  else if(p===4){o.phi=lerp(.52,.7,eT);
    if(t<.55){const a=lerp(Axd*.75,.004,ease(t/.55));dayPair(a);o.lines.push({...lineFoot(a,'sd'),kind:'twin'})}
    else if(t<.8){const w=ease((t-.55)/.25),N=180;
      const hd=lineFoot(.004,'nd'),hn=lineFoot(.004,'nn'),sd=lineFoot(.004,'sd'),sn=lineFoot(.004,'sn');
      o.lines.push({pts:blend(resample(hd.pts,N),resample(hn.pts,N),w),kind:'hero'},{pts:blend(resample(sd.pts,N),resample(sn.pts,N),w),kind:'twin'});
      o.foot={col:lerp(colDay(hd.pts[0]),0,w)+lerp(0,colNight(hn.pts[0]),w),mlt:w<.5?12:24}}
    else{const a=lerp(.004,.02,ease((t-.8)/.2));const h=lineFoot(a,'nn'),sn=lineFoot(a,'sn');o.lines.push({...h,kind:'hero'},{...sn,kind:'twin'});o.foot={col:colNight(h.pts[0]),mlt:24};
      o.streams.push({line:'hero',u0:uX(h.pts,-5),u1:uX(h.pts,-48),rate:3,dur:4.5,col:CSH},{line:'twin',u0:uX(sn.pts,-5),u1:uX(sn.pts,-48),rate:3,dur:4.5,col:CSH})}}
  else if(p===5){const a=lerp(.02,Axn-.0015,eT);const h=lineFoot(a,'nn');o.lines.push({...h,kind:'hero'},{...lineFoot(a,'sn'),kind:'twin'});
    o.foot={col:colNight(h.pts[0]),mlt:24};o.phi=lerp(.7,.92,eT);o.ps=lerp(1.6,.55,eT);const sn=twinOf(o);
    o.streams.push({line:'hero',u0:uX(h.pts,-5),u1:uX(h.pts,-48),rate:3,dur:4.5,col:CSH},{line:'twin',u0:uX(sn.pts,-5),u1:uX(sn.pts,-48),rate:3,dur:4.5,col:CSH})}
  else if(p===6){const a=lerp(Axn-.0015,Axn+.004,ease(t));const h=lineFoot(a,'nn');o.lines.push({...h,kind:'hero'});o.foot={col:colNight(h.pts[0]),mlt:24};
    if(a<Axn)o.lines.push({...lineFoot(a,'sn'),kind:'twin'});else{const y=traceFrom(a,eqRoot(a,XMIN+.3,-M.rxn-.05),true);if(y)o.lines.push({...y,kind:'imf'})}
    const f=win(t,.3,.75);o.fl.push({x:-M.rxn,z:0,k:Math.sin(PI*f)});o.phi=lerp(.92,.84,eT);o.ps=.55;
    if(t>.45){o.plasmoid=win(t,.45,1)*.25}if(t>.45)o.jets.push(['tailward',2])}
  else if(p===7){const a=lerp(Axn+.004,Axn+.05,eT);const h=lineFoot(a,'nn');o.lines.push({...h,kind:'hero'});o.foot={col:colNight(h.pts[0]),mlt:24};
    const y=traceFrom(a,eqRoot(a,XMIN+.3,-M.rxn-.05),true);if(y)o.lines.push({...y,kind:'imf',op:1-t});
    o.plasmoid=.25+.75*t;if(t<.55)o.jets.push(['earthward',4]);o.nightA=Math.min(1,win(t,.27,.5)*1.2)*(1-.35*win(t,.8,1));o.phi=lerp(.84,.5,eT);o.ps=lerp(.55,1.6,eT);
    if(t>.12&&t<.72){const ua=uApex(h.pts);o.streams.push({line:'hero',u0:ua,u1:.004,rate:13,dur:1.1,col:CEL},{line:'hero',u0:ua,u1:.996,rate:13,dur:1.1,col:CEL})}}
  else if(p===8){const N=200,hn=resample(lineFoot(Axn+.05,'nn').pts,N).map(q=>[-q[0],q[1]]),hd=resample(lineFoot(Axd+.03,'nd').pts,N);
    const rN=Math.max(...hn.map(q=>q[0])),rD=Math.max(...hd.map(q=>q[0]));
    const Rf=f=>lerp(rN,rD,f)+1.6*Math.sin(PI*f);                      // percorso a ferro di cavallo: più largo sui fianchi
    const loop=f=>{const b=blend(hn,hd,f),ap=Math.max(...b.map(q=>q[0])),k=(Rf(f)-1)/(ap-1);return b.map(q=>{const r=Math.hypot(q[0],q[1]),s=(1+(r-1)*k)/r;return[q[0]*s,q[1]*s]})};
    for(const sg of[1,-1])for(let k=0;k<3;k++){if(sg===1&&k===0)continue;const f=(t+k/3)%1;o.lines.push({pts:loop(f),kind:'flow',az:sg*PI*(1-f),op:.5*Math.min(1,f/.15,(1-f)/.15)})}
    const w=eT;o.lines.push({pts:loop(w),kind:'hero',az:PI*(1-w)});
    for(const sg of[1,-1]){const v3=[];for(let i=0;i<=48;i++){const f=i/48,r=Rf(f),a=sg*PI*(1-f);v3.push(new THREE.Vector3(-r*Math.cos(a),0,r*Math.sin(a)))}
      o.lines.push({v3,kind:'path',op:.6});const r=Rf(.5);o.arrows.push({o:new THREE.Vector3(1.2,0,sg*r),d:new THREE.Vector3(-1,0,0),L:2.6,col:0x8fd0ff})}
    const r5=Rf(.5);o.tags.push({v:new THREE.Vector3(0,-1.5,r5+3),t:'fianco del tramonto',c:'#8fd0ff'},{v:new THREE.Vector3(0,-1.5,-r5-3),t:'fianco dell’alba',c:'#8fd0ff'},{v:new THREE.Vector3(-rD-4,0,0),t:'← verso il Sole',c:'#ffd27a'});
    o.foot={col:lerp(colNight([-hn[0][0],hn[0][1]]),colDay(hd[0]),w),mlt:24-12*w};o.phi=lerp(.5,.45,eT);o.nightA=.65*(1-win(t,0,.6))}
  return o}

/* ---- linee del vento con Bz nord, disegnate a mano: si fermano a distanza (gap) dalla magnetopausa ---- */
const SP=x=>x>30?x:Math.log1p(Math.exp(x));
function surfX(az,gap){const T=M.mp;let best=-1e9;for(let i=1;i<T.length;i++){const a=T[i-1],b=T[i];if(Math.atan2(a[1],a[0])>1.8)break;
  const ra=Math.hypot(a[0],a[1]),rb=Math.hypot(b[0],b[1]),za=a[1]*(1+gap/ra),zb=b[1]*(1+gap/rb);
  if((za-az)*(zb-az)<=0&&za!==zb){const f=(az-za)/(zb-za);best=Math.max(best,lerp(a[0]*(1+gap/ra),b[0]*(1+gap/rb),f))}}return best}
function drape(xw,gap){const out=[];for(let i=0;i<=120;i++){const z=-42+84*i/120,xs=surfX(Math.abs(z),gap);out.push([xs<-1e8?xw:xs+1.2*SP((xw-xs)/1.2),z])}return out}
const NG=i=>2.4+i*1.25;
function northFlow(T,o){const r0=M.r0;for(let k=0;k<22;k++){const tau=(T-1.5*k)/6.5;if(tau<0||tau>1)continue;const g=NG(0)+(k%3)*.75,hero=k===0;
    if(tau<.45){o.lines.push({pts:drape(lerp(28,r0-4,ease(tau/.45)),g),kind:'imf',op:hero?1:.6,thin:!hero})}
    else{const w=ease(win(tau,.45,.7)),xw=lerp(r0-4,-78,ease(win(tau,.5,1)));o.lines.push({v3:slide(drape(r0-4,g),xw,k%3,w),kind:'imf',op:(hero?1:.6)*(1-win(tau,.85,1)),thin:!hero});
      if(hero&&tau<.9)o.tags.push({v:new THREE.Vector3(-xw,20,(rmpAt(Math.min(xw,r0-.01))+4)*w),t:'scivola sul fianco',c:'#ffe27a'})}}}                       // distanza di ogni linea dalla magnetopausa (R⊕)
function slide(d,xw,i,w){const Yo=(rmpAt(Math.min(xw,M.r0-.01))+4+2*i)*w;return d.map((q,k)=>new THREE.Vector3(-lerp(q[0],xw,w),lerp(q[1],-42+84*k/(d.length-1),w),Yo))}
/* ---- "Nel tempo": molte riconnessioni diurne, accumulo nei lobi, substorm, recupero ---- */
const EV=[.02,.085,.15,.215,.28,.345,.41,.475].map((t0,k)=>({t0,az:[0,.45,-.35,.2,-.5,.3,-.15,.55][k]})).concat([.86,.925].map((t0,k)=>({t0,az:[.25,-.3][k],rec:1})));
const EVL=.12,DPHI=.065;
function phiTime(t){let g=.4,r=0;for(const e of EV){const a=clamp((t-e.t0)/EVL*1.4,0,1),d=DPHI*ease(a);if(e.rec)r+=d;else g+=d}return g-.47*ease(win(t,.6,.84))+r}
function stateTime(t){
  const o={lines:[],fl:[],foot:null,phi:phiTime(t),dayA:0,nightA:0,cuspA:0,sheet:0,ps:1.6,plasmoid:-1,jets:[],arrows:[],tags:[],press:0,streams:[]};
  for(const e of EV){const a=(t-e.t0)/EVL;if(a<0||a>=1)continue;let q;
    if(a<.3)q=stateSouth(3,a/.3);else if(a<.6)q=stateSouth(4,(a-.3)/.3);else q=stateSouth(5,(a-.6)/.4);
    const op=1-win(a,.8,1);q.lines.forEach(l=>{if(l.kind==='imf')return;o.lines.push({...l,az:e.az,thin:true,op:(l.op==null?1:l.op)*op})});
    q.fl.forEach(f=>o.fl.push({...f,az:e.az}));o.dayA=Math.max(o.dayA,q.dayA*.8)}
  if(t>=.55&&t<.63){const q=stateSouth(6,win(t,.55,.63));o.lines.push(...q.lines);o.fl.push(...q.fl);o.plasmoid=q.plasmoid;q.jets.forEach(j=>o.jets.push(j))}
  else if(t>=.63&&t<.86){const q=stateSouth(7,win(t,.63,.86));o.lines.push(...q.lines);o.plasmoid=q.plasmoid;o.nightA=q.nightA;o.streams=q.streams;q.jets.forEach(j=>o.jets.push(j))}
  o.ps=clamp(lerp(2.2,.28,(o.phi-.4)/.52),.28,2.4);o.lobe=o.phi;
  const m=Math.round(t*150),st=t<.55?['gr','crescita: la coda si carica']:t<.63?['ss','inizio del substorm']:t<.84?['ss','espansione: la coda si scarica']:['gr','recupero: si ricomincia'];
  o.door=[st[0],'Nel tempo · '+m+' min · '+st[1]];
  const B=lobeB(o.phi);o.tags.push({v:V3(-64,rmpAt(-64)*.8),t:'B nei lobi ≈ '+Math.round(B)+' nT',c:'#6ee7a0'});
  return o}
function stateNorth(p,t){
  const o={lines:[],fl:[],foot:null,phi:.4,dayA:0,nightA:0,cuspA:0,sheet:0,ps:1.6,plasmoid:-1,jets:[],arrows:[],tags:[],press:0};const eT=ease(t),r0=M.r0;
  const hero=(sq,op)=>{const h=lineFoot(.09,'nd');o.lines.push({pts:h.pts,kind:'hero',op});o.foot={col:colDay(h.pts[0])*.9,mlt:12}};
  const cmp=k=>{o.arrows.push(AR(r0+NG(0)+1.2,-6,0,1,3.2,0xffd34d),AR(r0-2.6,-6,0,1,3.2,0x5fb3ff));if(k)o.tags.push({v:V3(r0+.6,-8),t:k,c:'#ffffff'})};
  const gapArrows=k=>{if(k<.02)return;o.arrows.push(AR(r0+NG(0)*.55,3,1,0,2.6*k,0xffffff),AR(r0-.6,3,-1,0,2.6*k,0xffffff))};
  if(p===0){[0,1,2].forEach(i=>o.lines.push({pts:drape(28+6*i,NG(0)+i*.75),kind:'imf',op:i?.55:1,thin:!!i}));hero(0);cmp('stesso verso');o.phi=.62}
  else if(p===1){northFlow(t*15,o);o.press=win(t,.1,.4);hero(0);cmp(t>.25?'stesso verso: si respingono':'stesso verso');gapArrows(win(t,.25,.5));
    if(t>.25)o.tags.push({v:V3(r0+NG(0)*.5,7.5),t:'pressione magnetica',c:'#d9b8ff'});o.phi=.62;o.lobe=.62}
  else if(p===2){northFlow(15+t*14,o);o.press=1;hero(0);gapArrows(.8);o.phi=lerp(.62,.36,eT);o.lobe=o.phi;o.ps=lerp(1.6,2.9,eT);
    o.door=['cl','Bz verso Nord · la coda si scarica lentamente (in ore)'];if(t>.15)o.tags.push({v:V3(-30,1),t:'plasma sheet più spessa',c:'#ffb070'})}
  else if(p===3){hero(.85,.35);o.press=.6;
    const Pc=mpPoint(1.72,1),imf=drape(Pc[0]+.4,NG(0)),lobe=lineFoot(.006,'nn').pts;
    // punto di contatto: coppia di punti più vicini sopra il polo
    let bi=0,bl=0,bd=1e9;for(let i=0;i<imf.length;i++){const q=imf[i];if(Math.hypot(q[0]-Pc[0],q[1]-Pc[1])>7)continue;for(let j=0;j<lobe.length;j+=2){const d=(q[0]-lobe[j][0])**2+(q[1]-lobe[j][1])**2;if(d<bd){bd=d;bi=i;bl=j}}}
    const P=[(imf[bi][0]+lobe[bl][0])/2,(imf[bi][1]+lobe[bl][1])/2];
    const pull=(pts,c,k)=>pts.map((q,j)=>{const g=Math.exp(-(((j-c)/14)**2))*k;return[q[0]+(P[0]-pts[c][0])*g,q[1]+(P[1]-pts[c][1])*g]});
    o.arrows.push(AR(P[0]+2.4,P[1]-1.2,0,1,2.4,0xffd34d),AR(P[0]-2.6,P[1]-1.2,.5,-1,2.4,0x6ee7a0));
    if(t<.45)o.tags.push({v:V3(P[0],P[1]+5),t:'versi opposti: riconnessione debole',c:'#ffffff'});
    const touch=ease(win(t,.08,.36));o.fl.push({x:P[0],z:P[1],k:Math.sin(PI*win(t,.34,.6))*.55});
    if(t<.45){o.lines.push({pts:pull(imf,bi,touch),kind:'imf'},{pts:pull(lobe,bl,touch),kind:'twin'})}
    else{const a=pull(imf,bi,1),b=pull(lobe,bl,1);
      const n1=b.slice(0,bl+1).concat(a.slice(bi)),n2=a.slice(0,bi+1).concat(b.slice(bl));
      const w=ease(win(t,.45,.75));const sm=resample(n1,160);
      o.lines.push({pts:blend(sm,sm.map((q,k)=>[q[0]*(1-.25*w),q[1]]),w),kind:'hero'});
      const w2=ease(win(t,.55,1));o.lines.push({v3:resample(n2,240).map(q=>new THREE.Vector3(-(q[0]-55*w2),q[1],16*w2)),kind:'imf',op:1-.5*w2});
      o.tags.push({v:V3(P[0]-1,P[1]+4),t:'si aggancia al polo',c:'#ffffff'});o.foot={col:4,mlt:12}}
    o.cuspA=Math.sin(PI*win(t,.4,1))}
  return o}

const pc=document.getElementById('pc'),px=pc.getContext('2d');
function capColat(phi){return 90-Math.asin(clamp(1-phi/15.3,0,1))*180/PI}
function drawPolar(st){
  const W=360,cx=180,cy=165,Rr=132,k=Rr/30;px.clearRect(0,0,W,pc.height);
  px.fillStyle='rgba(20,28,48,.9)';px.beginPath();px.arc(cx,cy,Rr,0,7);px.fill();
  px.strokeStyle='rgba(255,255,255,.18)';px.lineWidth=1.2;[10,20].forEach(c=>{px.beginPath();px.arc(cx,cy,c*k,0,7);px.stroke()});
  px.beginPath();px.moveTo(cx,cy-Rr);px.lineTo(cx,cy+Rr);px.moveTo(cx-Rr,cy);px.lineTo(cx+Rr,cy);px.stroke();
  const capC=capColat(st.phi),off=3*k;
  // celle di convezione

let uihLast=0;function measureUI(){const h=$('ui').offsetHeight;if(h!==uihLast){uihLast=h;document.documentElement.style.setProperty('--uih',h+'px')}}

let tPrev=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-tPrev)/1000);tPrev=now;
  let st;
  {const P=phases()[ST.p];
    if(ST.play){ST.t+=dt/P.dur;if(ST.t>=1){ST.t=1;ST.play=false;if(ST.auto)advance()}}
    {const Q=phases()[ST.p],ck=(Q.cam2&&ST.t>=Q.camAt)?Q.cam2:Q.cam;if(ck!==camKey)camKey=ck}

  FX.sublab=st.nightA>.5?V3(-10,-4):null;if(lbSub.e.textContent!==(st.nightA>.5?'substorm: breakup':''))lbSub.e.textContent=st.nightA>.5?'substorm: breakup':'';
  stepJets(dt);

  const cd=cam.position.distanceTo(ctl.target),rad=clamp(cd*.0032,.04,.45);arrowPool.forEach(g=>g.visible=false);curTags=(st.tags||[]).slice();
  (st.arrows||[]).slice(0,6).forEach((a,i)=>setArrow(arrowPool[i],a.o,a.d,a.L,rad,a.col));
  {const bz=ST.bz==='S'?-5:5,u=clamp(cd*.042,1.1,8),o=V3(1.3*M.r0+5,-u*2.4);
    const sp=new THREE.Vector3(.707,0,.707).multiplyScalar(u),bv=new THREE.Vector3(0,u*bz/5,0),tot=sp.clone().add(bv);
    setArrow(arrowPool[6],o,sp,sp.length(),rad*.9,0xa8a8a8);setArrow(arrowPool[7],o,bv.lengthSq()>1e-6?bv:UPV,bv.length(),rad*.9,0xffd34d);setArrow(arrowPool[8],o,tot,tot.length(),rad*.6,0xffffff,.75);
    curTags.push({v:o.clone().add(sp.clone().multiplyScalar(1.25)),t:'Bx, By (spirale): non apre',c:'#c8c8c8',sm:1});
    if(Math.abs(bz)>.5)curTags.push({v:o.clone().add(bv.clone().multiplyScalar(1.3)),t:bz<0?'Bz (Sud): apre':'Bz (Nord): chiude',c:'#ffd34d',sm:1})}

{const g=camGoal();cam.position.copy(g.pos);ctl.target.copy(g.tgt)}
